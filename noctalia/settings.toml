[bar.default]
capsule = true
capsule_groups = [ "sysmonitor" ]
center = [ "submap", "lock_keys", "media" ]
end = [
    "exchange_rates",
    "weather",
    "group:g1",
    "group:g2",
    "battery",
    "volume",
    "keyboard_layout",
    "clock",
    "notifications",
    "tray"
]
font_family = "Ioskeley Mono Semibold"
font_weight = 600
margin_edge = 0.0
margin_ends = 0.0
padding = 4
position = "bottom"
radius = 0
scale = 1.0
start = [ "workspaces", "active_window" ]
thickness = 34
widget_spacing = 12

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "ram", "cpu", "sysmon" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "network", "bluetooth" ]
    opacity = 1.0
    padding = 6.0

[desktop_widgets]
enabled = false

[idle]
behavior_order = [ "lock", "screen-off", "suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660

    [idle.behavior.suspend]
    action = "suspend"
    enabled = false
    lock_before_suspend = true
    timeout = 900

[keybinds]
down = [ "Down", "Ctrl+j" ]
up = [ "Up", "Ctrl+k" ]

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.3

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-widget-0000000000000001", "lockscreen-widget-0000000000000002" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1700.0
    cy = 1129.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        center_password_text = false
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 256.0
    box_width = 592.0
    cx = 1704.0
    cy = 304.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        clock_style = "digital"
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 256.0
    box_width = 592.0
    cx = 1704.0
    cy = 736.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "weather"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = true
        background_color = "surface"
        shadow = false

[notification]
scale = 1.1

[plugins]
enabled = [ "me/submap", "me/exchange_rates", "noctalia/screen_recorder" ]

    [[plugins.source]]
    kind = "path"
    location = "/home/kristijan/.config/noctalia/plugins"
    name = "my-dev"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official-plugins"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community-plugins"

[shell]
clipboard_enabled = false
font_family = "Ioskeley Mono Semibold"
polkit_agent = true
ui_scale = 1.0

    [shell.launcher.providers.session]
    global = true

    [shell.launcher.providers.windows]
    global = true

    [shell.panel]
    launcher_session_search = true
    open_near_click_control_center = true

    [shell.screenshot]
    directory = "/home/kristijan/Pictures/screenshots"
    filename_pattern = "screenshot_%Y_%m_%d_%H_%M_%S"

[theme]
community_palette = "One"
source = "community"

[wallpaper]
directory = "/home/kristijan/Pictures/Wallpapers"

    [wallpaper.automation]
    enabled = true
    interval_minutes = 60

[weather]
auto_locate = true

[widget.active_window]
max_length = 400
title_scroll = "on_hover"

[widget.clock]
capsule = true
capsule_padding = 10.0
format = "{:%H:%M %a}, {:%b %d}"

[widget.cpu]
capsule = true
capsule_group = "sysmonitor"
capsule_padding = 10.0
display = "text"
visualization = "none"

[widget.exchange_rates]
type = "me/exchange_rates:exchange_rates"

[widget.keyboard_layout]
capsule = true
capsule_padding = 10.0

[widget.lock_keys]
capsule = true
display = "full"
hide_when_off = true

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.ram]
capsule = true
capsule_group = "sysmonitor"
display = "text"
visualization = "none"

[widget.separator]
type = "spacer"

[widget.submap]
type = "me/submap:submap"

[widget.sysmon]
capsule = true
capsule_group = "sysmonitor"
show_value = true
stat = "disk_free"
visualization = "none"

[widget.tray]
drawer = true
pinned = [ "slack", "ViberPC" ]

[widget.weather]
capsule = true
capsule_padding = 10.0
show_condition = false

[widget.workspaces]
capsule = true
hide_when_empty = true
scale = 1.2
